// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Protect against IDE tooling plugins (e.g. Eclipse Buildship / JDT LS) failing on Gradle 9+
    // when attempting to change the allowed usage of configurations locked to 'Dependency Scope'
    configurations.all { config ->
        try {
            def origResolved = config.class.getMethod('setCanBeResolved', boolean.class)
            config.metaClass.setCanBeResolved = { boolean resolvable ->
                try {
                    origResolved.invoke(delegate, resolvable)
                } catch (Throwable ignored) {
                    // Suppress "locked upon creation to the role: Dependency Scope"
                }
            }
        } catch (Throwable ignored) {}
        try {
            def origConsumed = config.class.getMethod('setCanBeConsumed', boolean.class)
            config.metaClass.setCanBeConsumed = { boolean consumable ->
                try {
                    origConsumed.invoke(delegate, consumable)
                } catch (Throwable ignored) {
                    // Suppress "locked upon creation to the role: Dependency Scope"
                }
            }
        } catch (Throwable ignored) {}
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
